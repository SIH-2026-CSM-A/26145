[project]
name = "sih26145"
version = "0.1.0"
description = "AI-Based Detection of Cyber Threats in Unidirectional IP Traffic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "dpkt>=1.9.8",
    "fastapi>=0.141.1",
    "lightgbm>=4.6",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.53.0",
]

[project.scripts]
sih26145 = "sih26145.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sih26145"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
