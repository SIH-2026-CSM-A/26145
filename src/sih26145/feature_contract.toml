# Unidirectional Feature Contract — the single declaration of every feature SIH26145 computes.
#
# Layer 1 (this file): a static state per feature.
#   computable        fully derivable from whichever half of the conversation is captured
#   degraded          derivable, with the stated loss
#   reverse_dependent needs the other half; computed only when the flow observed it
#                     (FlowRecord.reverse_seen / responder_seen), else UnavailableFeatureError
#   unavailable       unobtainable here: needs decryption, active probing, or our own handshake
# Layer 2 (runtime): FlowRecord.observability_state per flow — see docs/ARCHITECTURE.md §5-6.
#
# Columns: tier = flow | host | dst | pair | global | link
#          approx = exact | hll | cms | bucketed | ewma | capped   (estimation error, separate from state;
#                   capped = exact up to a stated cap, then saturates)
#          sources = ingest adapters that yield it (dpkt, zeek)
# Consumers (detectors, models) declare max_state and the exact features they read;
# tests/contract/ checks their source code against these declarations.
# Changing a row or a consumer's reads = bump contract_version.

contract_version = "1.4.0"

features = [
  # ---- Tier 1: per-flow FeatureVector ------------------------------------------------------
  { name = "duration",                state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Span of observed packets; covers both halves when both are captured." },
  { name = "total_packets",           state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Count of observed packets (both halves if captured)." },
  { name = "total_bytes",             state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Sum of observed frame lengths, taken from each record's original (wire) length (classic pcap and pcapng), so snaplen-truncated captures count full sizes (AUDIT A8, fixed)." },
  { name = "pps",                     state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "total_packets / duration; meaningless for sub-millisecond flows (AUDIT A1)." },
  { name = "bps",                     state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "total_bytes / duration; same caveats as pps and total_bytes." },
  { name = "pkt_size_min",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "Observed frame sizes. Zeek conn.log has no size distribution." },
  { name = "pkt_size_max",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As pkt_size_min." },
  { name = "pkt_size_mean",           state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As pkt_size_min." },
  { name = "pkt_size_std",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As pkt_size_min." },
  { name = "pkt_size_q25",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As pkt_size_min." },
  { name = "pkt_size_q50",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As pkt_size_min." },
  { name = "pkt_size_q75",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As pkt_size_min." },
  { name = "iat_mean",                state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "Inter-arrival over all observed packets (both halves interleaved if captured). Zeek needs the IAT script." },
  { name = "iat_var",                 state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As iat_mean." },
  { name = "iat_min",                 state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As iat_mean." },
  { name = "iat_max",                 state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "As iat_mean." },
  { name = "jitter",                  state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "Mean |delta IAT|; as iat_mean." },
  { name = "burstiness_ratio",        state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "Coefficient of variation of packet SIZE, not temporal burstiness (AUDIT A1)." },
  { name = "small_pkt_ratio",         state = "computable", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "Fraction of observed frames < 64 bytes." },
  { name = "is_tcp",                  state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "IP protocol header." },
  { name = "is_udp",                  state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "IP protocol header." },
  { name = "is_icmp",                 state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "IP protocol header." },
  { name = "dst_port",                state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Destination port of the flow key (first observed packet)." },
  { name = "dst_port_class",          state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Coarse service class of dst_port for models (0 no port, 1 < 1024, 2 1024-49151, 3 >= 49152): exact ports are a leakage risk." },
  { name = "dns_query_count",         state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Question section is present in both queries and responses, so either half yields it." },
  { name = "dns_max_domain_entropy",  state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Shannon entropy of the queried name; either half." },
  { name = "dns_max_subdomain_depth", state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Label count of the queried name; either half." },
  { name = "tls_client_hello_count",  state = "degraded",   tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Needs the client half (ClientHello); absent on reverse_only flows. QUIC ClientHellos are unavailable (encrypted)." },
  { name = "tls_max_sni_entropy",     state = "degraded",   tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Client half only; SNI replaced by the public name under ECH." },
  { name = "tls_max_sni_length",      state = "degraded",   tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "As tls_max_sni_entropy." },
  { name = "has_syn",                 state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "OR of TCP flags over observed packets." },
  { name = "has_fin",                 state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "OR of TCP flags over observed packets." },
  { name = "has_rst",                 state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "OR of TCP flags over observed packets." },

  { name = "tls_ja3",                 state = "degraded",   tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "JA3 of the cleartext ClientHello: client half only; not available for QUIC." },
  { name = "tls_ja4",                 state = "degraded",   tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "JA4 (TCP 't' variant) of the cleartext ClientHello: client half only; QUIC 'q' variant needs decryption." },
  { name = "tls_ja3s",                state = "degraded",   tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "JA3S of the cleartext ServerHello: server half only. JA4S deferred (FoxIO licence)." },

  # ---- Flow-level direction and observability ----------------------------------------------
  { name = "reverse_seen",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Packets matching the reversed 5-tuple were observed (zeek: resp_pkts > 0)." },
  { name = "flow_direction",          state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "outbound/inbound/internal/external from the internal-CIDR policy; no reverse half needed." },
  { name = "egress_bytes",            state = "computable", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Bytes observed travelling internal -> external in this flow, whichever half carried them." },

  # ---- Tier 2: FeatureStore windowed rollups ("_w" = current + previous window, W..2W s) -------
  { name = "src_flows_w",               state = "computable", tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Flows first observed from this host." },
  { name = "src_distinct_dsts_w",       state = "computable", tier = "host", approx = "hll",      sources = ["dpkt", "zeek"], reason = "Fan-out: distinct destination IPs from this host (HLL p=8, ~6.5% error)." },
  { name = "src_distinct_dst_ports_w",  state = "computable", tier = "host", approx = "hll",      sources = ["dpkt", "zeek"], reason = "Distinct destination ports from this host." },
  { name = "src_syn_only_ratio_w",      state = "degraded",   tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Share of TCP flows where the initiator sent SYN and never ACKed. Proxy for failed handshakes that needs no reverse half; a SYN-ACK lost beyond the tap looks the same." },
  { name = "src_dns_queries_w",         state = "computable", tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Queried names attributed to the DNS client side of each flow." },
  { name = "src_distinct_qnames_w",     state = "computable", tier = "host", approx = "hll",      sources = ["dpkt", "zeek"], reason = "Distinct queried names per client." },
  { name = "src_high_entropy_qnames_w", state = "computable", tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Queried names whose first label has Shannon entropy >= 3.5 bits (configurable)." },
  { name = "src_qname_len_sum_w",       state = "computable", tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Total characters queried: a volume proxy for DNS tunnelling." },
  { name = "src_nxdomain_rate_w",       state = "reverse_dependent", tier = "host", approx = "exact", sources = ["dpkt", "zeek"], reason = "NXDOMAIN share of resolver responses to this client. Computed whenever resolver responses were captured, including a responses-only capture; raises UnavailableFeatureError when none were." },
  { name = "src_distinct_ja4_w",        state = "degraded",   tier = "host", approx = "hll",      sources = ["dpkt", "zeek"], reason = "Distinct JA4 client fingerprints; needs the client half." },
  { name = "src_periodic_dsts_w",       state = "computable", tier = "host", approx = "hll",      sources = ["dpkt", "zeek"], reason = "Distinct destinations this host contacts at a regular interval (pair inter-flow CV <= 0.35 over >= 3 gaps). A beacon has one or two; a poller has dozens." },
  { name = "src_egress_bytes_1m",       state = "degraded",   tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Internal->external bytes from this host in the current minute. Counts only captured halves: a capture holding only inbound halves sees no egress." },
  { name = "src_egress_bytes_5m",       state = "degraded",   tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "As src_egress_bytes_1m, last 5 one-minute buckets." },
  { name = "src_egress_bytes_1h",       state = "degraded",   tier = "host", approx = "exact",    sources = ["dpkt", "zeek"], reason = "As src_egress_bytes_1m, last 60 one-minute buckets." },
  { name = "src_egress_bytes_z",        state = "degraded",   tier = "host", approx = "ewma",     sources = ["dpkt", "zeek"], reason = "Current-minute egress vs this host's EWMA baseline; null until 5 minutes of baseline. Same capture caveat as src_egress_bytes_1m." },
  { name = "off_hours",                 state = "computable", tier = "flow", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Event time outside configured working hours/days (enclave local time)." },
  { name = "dst_flows_w",               state = "computable", tier = "dst",  approx = "exact",    sources = ["dpkt", "zeek"], reason = "Flows toward this destination." },
  { name = "dst_bytes_w",               state = "computable", tier = "dst",  approx = "exact",    sources = ["dpkt", "zeek"], reason = "Observed bytes of flows toward this destination (both halves if captured)." },
  { name = "dst_distinct_srcs_w",       state = "computable", tier = "dst",  approx = "hll",      sources = ["dpkt", "zeek"], reason = "Fan-in: distinct sources toward this destination." },
  { name = "dst_src_ip_entropy_w",      state = "computable", tier = "dst",  approx = "bucketed", sources = ["dpkt", "zeek"], reason = "Entropy of source IPs toward this destination over 128 hash buckets; saturates at 7 bits, collisions bias low." },
  { name = "dst_syn_only_ratio_w",      state = "degraded",   tier = "dst",  approx = "exact",    sources = ["dpkt", "zeek"], reason = "As src_syn_only_ratio_w, per destination (SYN-flood signal)." },
  { name = "dst_reflector_flows_w",     state = "degraded",   tier = "dst",  approx = "exact",    sources = ["dpkt", "zeek"], reason = "UDP flows toward this endpoint from a reflector source port (53, 123, 1900, 11211, 389, 19, 161, 111) on which the endpoint sent nothing: unsolicited. Needs the endpoint's own half to prove a response was solicited, so on a capture holding only inbound halves genuine answers are counted too." },
  { name = "dst_reflector_bytes_w",     state = "degraded",   tier = "dst",  approx = "exact",    sources = ["dpkt", "zeek"], reason = "Bytes sent by the reflectors in dst_reflector_flows_w; same capture caveat." },
  { name = "dst_reflector_mean_pkt_w",  state = "degraded",   tier = "dst",  approx = "exact",    sources = ["dpkt"],         reason = "Mean packet size sent by those reflectors (amplified responses are large); same capture caveat. Null when there are none." },
  { name = "dst_bytes_vs_baseline",     state = "computable", tier = "dst",  approx = "ewma",     sources = ["dpkt", "zeek"], reason = "Current-window bytes toward this destination / its EWMA of past window totals (silent windows count as zero). Null until 5 windows have closed: the baseline needs warm-up." },
  { name = "dst_flows_vs_baseline",     state = "computable", tier = "dst",  approx = "ewma",     sources = ["dpkt", "zeek"], reason = "As dst_bytes_vs_baseline, for flow counts." },
  { name = "dst_distinct_srcs_longterm", state = "computable", tier = "dst", approx = "hll",      sources = ["dpkt", "zeek"], reason = "Distinct sources ever seen toward this destination while tracked (rarity). Includes the current flow: 1 = only this source." },
  { name = "pair_flows_w",              state = "computable", tier = "pair", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Flows from src to dst." },
  { name = "pair_iat_mean",             state = "computable", tier = "pair", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Mean gap between successive flow starts src->dst (Welford)." },
  { name = "pair_iat_cv",               state = "computable", tier = "pair", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Coefficient of variation of those gaps; low = periodic. Null below 2 gaps." },
  { name = "pair_iat_n",                state = "computable", tier = "pair", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Number of inter-flow gaps observed." },
  { name = "pair_history_count",        state = "computable", tier = "pair", approx = "cms",      sources = ["dpkt", "zeek"], reason = "Long-horizon flow count src->dst (Count-Min, halves daily). Includes the current flow: 1 = first contact." },
  { name = "ja4_prevalence",            state = "degraded",   tier = "global", approx = "cms",    sources = ["dpkt", "zeek"], reason = "How often this JA4 has been seen enclave-wide (Count-Min, halves daily). Client half only." },
  { name = "link_reverse_visibility_w", state = "computable", tier = "link", approx = "exact",    sources = ["dpkt", "zeek"], reason = "Fraction of flows in the window with reverse_seen: the link's measured visibility." },

  # ---- Fast lane: 1-s packet counters before flow assembly (detectors/fastlane.py) ----------
  # Tables are opened by a SYN (no ACK) or by UDP from a reflector port; counts saturate at 4,096.
  { name = "fl_dst_packets_1s",        state = "computable", tier = "dst",  approx = "exact",  sources = ["dpkt"], reason = "Packets toward a destination in the 1-s window, counted once a SYN or reflector-port UDP packet has opened its table in that window." },
  { name = "fl_dst_syns_1s",           state = "computable", tier = "dst",  approx = "exact",  sources = ["dpkt"], reason = "TCP packets with SYN and without ACK toward the destination in the window." },
  { name = "fl_dst_syn_srcs_1s",       state = "computable", tier = "dst",  approx = "capped", sources = ["dpkt"], reason = "Distinct sources that sent SYNs toward the destination in the window (exact, saturates at 4,096)." },
  { name = "fl_dst_syn_only_share_1s", state = "degraded",   tier = "dst",  approx = "capped", sources = ["dpkt"], reason = "Share of those SYN sources that sent no ACK-bearing packet to the destination in the same window. Uses the initiator half only; a handshake split across a window boundary counts as unanswered." },
  { name = "fl_dst_src_entropy_1s",    state = "computable", tier = "dst",  approx = "capped", sources = ["dpkt"], reason = "Shannon entropy (bits) of SYN counts per source toward the destination in the window." },
  { name = "fl_dst_ttl_spread_1s",     state = "computable", tier = "dst",  approx = "exact",  sources = ["dpkt"], reason = "Max minus min IP TTL of the SYNs toward the destination in the window. Near 0 from many sources suggests one sender spoofing them; evidence only." },
  { name = "fl_dst_refl_srcs_1s",      state = "degraded",   tier = "dst",  approx = "capped", sources = ["dpkt"], reason = "Distinct reflector-port sources (53, 123, 1900, 11211, 389, 19, 161, 111) sending UDP to the destination that it did not query in this or the previous second. Needs the destination's own half to prove a query; on an inbound-only capture genuine answers are counted too." },
  { name = "fl_dst_refl_bytes_1s",     state = "degraded",   tier = "dst",  approx = "capped", sources = ["dpkt"], reason = "Wire bytes from those unsolicited reflectors in the window; same capture caveat." },
  { name = "fl_dst_refl_mean_pkt_1s",  state = "degraded",   tier = "dst",  approx = "capped", sources = ["dpkt"], reason = "Mean packet size from those reflectors (amplified answers are large); null when there are none." },
  { name = "fl_src_syn_targets_1s",    state = "computable", tier = "host", approx = "capped", sources = ["dpkt"], reason = "Distinct (destination, port) targets this source sent SYNs to in the window." },
  { name = "fl_src_syn_only_share_1s", state = "degraded",   tier = "host", approx = "capped", sources = ["dpkt"], reason = "Share of those targets this source never sent an ACK-bearing packet to in the window. Initiator half only." },
  { name = "fl_src_distinct_dsts_1s",  state = "computable", tier = "host", approx = "capped", sources = ["dpkt"], reason = "Distinct destination hosts among this source's SYN targets in the window." },
  { name = "fl_src_distinct_ports_1s", state = "computable", tier = "host", approx = "capped", sources = ["dpkt"], reason = "Distinct destination ports among this source's SYN targets in the window." },

  # ---- Reverse-dependent: computed only when the needed half was observed on this flow --------
  { name = "outbound_inbound_byte_ratio", state = "reverse_dependent", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Needs bytes in both directions. Never estimated when the inbound half is missing.", substitutes = ["src_egress_bytes_z", "dst_distinct_srcs_longterm", "off_hours"] },
  { name = "tcp_handshake_completed", state = "reverse_dependent", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "SYN in one direction and SYN-ACK in the other." },
  { name = "tcp_rtt",                 state = "reverse_dependent", tier = "flow", approx = "exact", sources = ["dpkt"], reason = "Tap-observed SYN -> SYN-ACK delay: the responder leg as seen from the tap." },
  { name = "tls_client_server_fp_pair", state = "reverse_dependent", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "JA4 of the ClientHello paired with JA3S of the ServerHello: needs both halves." },
  { name = "dns_nxdomain_rate",       state = "reverse_dependent", tier = "flow", approx = "exact", sources = ["dpkt", "zeek"], reason = "Needs the resolver's responses. Computed whenever they were captured (responder_seen), including a responses-only capture that never saw the query; unavailable otherwise." },

  # ---- Unavailable: needs decryption, active probing, or our own handshake -------------------
  { name = "quic_client_hello",       state = "unavailable", tier = "flow", approx = "exact", sources = [], reason = "QUIC Initial packets are AEAD-protected. The keys are public, but removing them is decryption and the PS forbids detection from decrypted content." },
  { name = "tls13_server_certificate", state = "unavailable", tier = "flow", approx = "exact", sources = [], reason = "TLS 1.3 encrypts the Certificate message; reading it needs decryption." },
  { name = "jarm_server_fingerprint", state = "unavailable", tier = "flow", approx = "exact", sources = [], reason = "JARM sends ten crafted ClientHellos: our own handshake. The enclave never transmits." },
  { name = "service_banner_probe",    state = "unavailable", tier = "flow", approx = "exact", sources = [], reason = "Needs active probing of the destination." },
]

# ---- Consumers ---------------------------------------------------------------------------
# max_state: the highest state the consumer may read (computable < degraded < reverse_dependent).
# reads: exactly the features its code reads; tests/contract/ enforces equality.

[consumers.ddos_volume_detector]
ps_class = "a"
max_state = "degraded"
reads = ["dst_distinct_srcs_w", "dst_src_ip_entropy_w", "dst_syn_only_ratio_w",
         "dst_reflector_flows_w", "dst_reflector_bytes_w", "dst_reflector_mean_pkt_w",
         "dst_bytes_vs_baseline", "dst_flows_vs_baseline", "dst_bytes_w", "dst_flows_w"]
weakness = "The volumetric rule needs 5 closed windows of per-destination baseline before it can fire (warm-up)."
tuning = "Ruleset 2.1.0 (docs/RULES.md): MIN_SRCS 100 -> 200, BASELINE_MULT 10 -> 100. No DDoS TP in the tuning set; bounded by the generated attack captures only."

[consumers.c2_beacon_detector]
ps_class = "b"
max_state = "computable"
reads = ["pair_iat_n", "pair_iat_cv", "pair_iat_mean", "src_periodic_dsts_w"]
weakness = "Beacons with jitter above ~70% (CV > 0.40), fewer than 16 check-ins or a period under 10 s, and pollers slower than the windowed periodic-destination signature can see; the latter belong on the poller allowlist."
tuning = "Ruleset 2.1.0 (docs/RULES.md): MIN_GAPS 8 -> 16, MAX_CV 0.35 -> 0.40, MIN_PERIOD 1 s -> 10 s."

[consumers.dga_lexical_detector]
ps_class = "c"
max_state = "reverse_dependent"
reads = ["dns_query_count", "src_high_entropy_qnames_w", "src_distinct_qnames_w", "src_nxdomain_rate_w"]
weakness = "Dictionary DGAs (word-based names) have ordinary label entropy and are not caught. Without resolver responses, a host resolving many CDN-style names can reach the lexical threshold."

[consumers.dns_tunnel_detector]
ps_class = "c"
max_state = "computable"
reads = ["dns_query_count", "src_dns_queries_w", "src_qname_len_sum_w"]
weakness = "Low-and-slow tunnels under 50 queries per window, or with short labels, are not caught."

[consumers.encrypted_anomaly_detector]
ps_class = "d"
max_state = "degraded"
reads = ["tls_ja4", "ja4_prevalence", "pair_history_count", "pair_flows_w", "total_bytes", "duration"]
weakness = "A single-user client with a fingerprint unique to the enclave, reconnecting often to one server, looks the same as a rare-fingerprint beacon; the known-bad list ships empty."

[consumers.recon_portscan_detector]
ps_class = "e"
max_state = "degraded"
reads = ["is_tcp", "src_distinct_dsts_w", "src_distinct_dst_ports_w", "src_syn_only_ratio_w", "dst_distinct_srcs_w"]
weakness = "Connect scans that complete the handshake are not SYN-only; scans slower than 20 targets per window, or with under 80% unanswered SYNs, are not caught."
tuning = "Ruleset 2.1.0 (docs/RULES.md): MIN_SYN_ONLY 0.6 -> 0.8, SHARED_INFRA_SRCS 20 -> 5."

[consumers.exfiltration_detector]
ps_class = "f"
max_state = "reverse_dependent"
reads = ["egress_bytes", "outbound_inbound_byte_ratio", "src_egress_bytes_z", "dst_distinct_srcs_longterm", "off_hours"]
tuning = "Ruleset 2.1.0 (docs/RULES.md): MIN_RATIO 10 -> 50, MAX_DST_SOURCES 2 -> 1."

[consumers.fastlane_detector]
ps_class = "a,e"
max_state = "degraded"
reads = ["fl_dst_packets_1s", "fl_dst_syns_1s", "fl_dst_syn_srcs_1s", "fl_dst_syn_only_share_1s",
         "fl_dst_src_entropy_1s", "fl_dst_ttl_spread_1s", "fl_dst_refl_srcs_1s", "fl_dst_refl_bytes_1s",
         "fl_dst_refl_mean_pkt_1s", "fl_src_syn_targets_1s", "fl_src_syn_only_share_1s",
         "fl_src_distinct_dsts_1s", "fl_src_distinct_ports_1s"]
weakness = "Provisional only: one-second windows see floods and scans faster than 50 SYN sources, 20 reflectors or 20 SYN targets per second. Slower ones are left to the flow lane. No shared-infrastructure suppression: a fast sweep of a popular server is flagged and stays unconfirmed."

[consumers.ml_flow_models]
ps_class = "all"
max_state = "degraded"
reads = [
  "duration", "total_packets", "total_bytes", "pps", "bps",
